[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-project-governance"
version = "4.0.0"
description = "Simplified Databricks project registry, tag compliance gate, and production dispatcher."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.29",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "typer==0.26.3",
  "databricks-sql-connector==4.3.0"
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "ruff>=0.12,<1",
  "build>=1.2,<2"
]

[project.scripts]
governance-worker = "governance_worker.cli:app"

[tool.setuptools]
packages = ["app", "governance_worker"]
include-package-data = true

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
